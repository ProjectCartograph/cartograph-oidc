# What scripts/kind-e2e installs beside the chart: the fictional
# directory, a Postgres, and the four Secrets the chart expects. Local
# placeholders throughout.
apiVersion: v1
kind: Secret
metadata:
  name: cartograph-dex-secrets
stringData:
  DEX_CLIENT_SECRET: kind-client-secret
  LDAP_BIND_PASSWORD: try-cartograph
---
apiVersion: v1
kind: Secret
metadata:
  name: cartograph-oauth2-proxy-secrets
stringData:
  client-id: cartograph
  client-secret: kind-client-secret
  cookie-secret: kind-cookie-secret-of-32-bytes!!
---
apiVersion: v1
kind: Secret
metadata:
  name: cartograph-database
stringData:
  url: postgres://cartograph:cartograph@postgres:5432/cartograph?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: cartograph-agent-key
stringData:
  agent-key: kind-agent-signing-key-placeholder-of-48-bytes!!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glauth
spec:
  selector:
    matchLabels: { app: glauth }
  template:
    metadata:
      labels: { app: glauth }
    spec:
      containers:
        - name: glauth
          image: glauth/glauth:v2.5.4
          ports: [{ containerPort: 3893 }]
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: glauth
            items: [{ key: glauth.cfg, path: config.cfg }]
---
apiVersion: v1
kind: Service
metadata:
  name: glauth
spec:
  selector: { app: glauth }
  ports: [{ port: 3893 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - { name: POSTGRES_USER, value: cartograph }
            - { name: POSTGRES_PASSWORD, value: cartograph }
            - { name: POSTGRES_DB, value: cartograph }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "cartograph", "-d", "cartograph"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
