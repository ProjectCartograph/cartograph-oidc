# A directory to try cartograph-oidc against: GLAuth, an LDAP server
# configured by this one file. Every person and team here is fictional,
# from Cartograph's running example. Every password is "try-cartograph".
# In production Dex talks to the organisation's own directory instead
# (docs/PRODUCTION.md); nothing below is used there.

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=example,dc=org"


