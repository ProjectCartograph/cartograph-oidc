# Which directory groups grant which of Cartograph's roles, and which
# groups are teams (cartograph-engine docs/DEPLOYMENT.md, "Access by
# role and team"). A person whose groups grant a role is listed at their
# first sign-in; an administrator can list anyone else from the Access
# page. `cartograph access apply` creates the teams, parents first.
roles:
  reader: [staff]
  contributor: [curriculum-division, early-grades-team, assessment-unit]
  strategyEditor: [planning-unit]
  administrator: [cartograph-administrators]
# The roles whose people may connect an agent over MCP (cartograph-engine
# docs/adr/0016). Their agents read, draft and propose; the people accept.
agents: [contributor, strategyEditor]
teams:
  - group: curriculum-division
    name: Curriculum division
  - group: early-grades-team
    name: Early grades
    parent: Curriculum division
  - group: assessment-unit
    name: Assessment
  - group: planning-unit
    name: Planning
